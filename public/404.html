<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to NoteZ...</title>
  </head>
  <body>
    <script>
      // GitHub Pages fallback for the NoteZ single-page React application.
      (function () {
        var base = "/NZ/";
        var pathname = window.location.pathname;
        var route = "";

        if (pathname.indexOf(base) === 0) {
          route = pathname.slice(base.length);
        } else {
          route = pathname.split("/").filter(Boolean).join("/");
        }

        var params = new URLSearchParams();
        params.set("p", route);

        if (window.location.search.length > 1) {
          params.set("q", window.location.search.slice(1));
        }

        window.location.replace(
          base + "?" + params.toString() + window.location.hash
        );
      })();
    </script>
  </body>
</html>
