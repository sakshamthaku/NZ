<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>NoteZ</title>
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <script>
      // GitHub Pages SPA fallback: restore the requested route after 404.html redirects here.
      (function (location) {
        var params = new URLSearchParams(location.search);
        var route = params.get('p');
        if (route) {
          params.delete('p');
          var query = params.toString();
          var restored = location.pathname.replace(/\\/$/, '') + '/' + route.replace(/^\\//, '');
          window.history.replaceState(null, '', restored + (query ? '?' + query : '') + location.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="%BASE_URL%src/main.jsx"></script>
  </body>
</html>
