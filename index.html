    <title>NoteZ</title>
    <script>
      // Restore GitHub Pages deep links before the NoteZ app bundle starts.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var route = params.get("p");
        if (!route) return;

        var originalQuery = params.get("q") || "";
        params.delete("p");
        params.delete("q");

        var remainingQuery = params.toString();
        var finalQuery = originalQuery || remainingQuery;
        var path = window.location.pathname;

        while (path.length > 1 && path.charAt(path.length - 1) === "/") {
          path = path.slice(0, -1);
        }

        window.history.replaceState(
          null,
          "",
          path + "/" + route +
            (finalQuery ? "?" + finalQuery : "") +
            window.location.hash
        );
      })();
    </script>
